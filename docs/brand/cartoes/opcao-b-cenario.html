<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>Cartão · sobre o cenário</title>
<style>
  html,body{margin:0;width:1920px;height:1080px;overflow:hidden;font-family:"Inter","Figtree",-apple-system,sans-serif}
  .stage{position:relative;width:1920px;height:1080px;overflow:hidden;background:#222}
  /* o próprio estúdio desfocado vira o fundo do cartão: continuidade com a cena */
  .bg{position:absolute;inset:-40px;background:url(marina.png) center/cover;filter:blur(22px) saturate(1.05) brightness(.92)}
  .pip{position:absolute;right:70px;top:70px;width:420px;height:236px;border-radius:22px;background:url(marina.png) 58% 30%/180% auto;
       box-shadow:0 18px 50px rgba(0,0,0,.35);border:4px solid rgba(255,255,255,.85)}
  .pip span{position:absolute;left:14px;bottom:12px;background:rgba(15,16,48,.8);color:#fff;font-size:20px;font-weight:600;padding:6px 12px;border-radius:999px}
  .card{position:absolute;left:110px;top:150px;width:1080px;padding:64px 70px 60px;border-radius:36px;
        background:rgba(255,255,255,.93);box-shadow:0 30px 80px rgba(15,16,48,.30)}
  .kicker{font-size:26px;font-weight:700;color:#A84C00;letter-spacing:.02em}
  h1{font-size:76px;line-height:1.04;margin:14px 0 18px;color:#1D1E4C;font-weight:800;letter-spacing:-.02em}
  .bar{width:150px;height:10px;border-radius:5px;background:#FF7A08;margin-bottom:40px}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:26px}
  .item{border-radius:24px;background:#F4F7FA;border:1px solid #E1E6EE;padding:28px 26px 30px}
  .ic{width:68px;height:68px;border-radius:18px;background:#1D1E4C;display:grid;place-items:center;margin-bottom:22px}
  .ic svg{width:38px;height:38px;stroke:#FF9A3D;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
  .item p{margin:0;font-size:36px;line-height:1.18;color:#3F4270}
  .item b{color:#1D1E4C;font-weight:800}
  .wm{position:absolute;right:60px;bottom:46px;height:40px;opacity:.8;filter:drop-shadow(0 2px 6px rgba(0,0,0,.35))}
</style></head><body><div class="stage">
  <div class="bg"></div>
  <div class="card">
    <div class="kicker">Escola · Família · Bairro · Projetos</div>
    <h1>Isso também é experiência</h1>
    <div class="bar"></div>
    <div class="grid">
      <div class="item"><div class="ic"><svg viewBox="0 0 24 24"><path d="M3 21h18M5 21V8l7-5 7 5v13"/><path d="M9 21v-6h6v6"/></svg></div><p>Ajudar no <b>negócio da família</b></p></div>
      <div class="item"><div class="ic"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg></div><p>Organizar <b>eventos</b> da escola</p></div>
      <div class="item"><div class="ic"><svg viewBox="0 0 24 24"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8L12 21l8.8-8.6a5.5 5.5 0 0 0 0-7.8z"/></svg></div><p><b>Voluntariado</b>, esporte e <b>cursos</b></p></div>
    </div>
  </div>
  <div class="pip"><span>Marina</span></div>
  <img class="wm" src="logo-branco.png" alt="">
</div></body></html>
