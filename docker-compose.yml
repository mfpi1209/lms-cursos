# Ambiente local completo: Postgres + Redis + web + worker.
# Para desenvolvimento do dia a dia, basta `docker compose up postgres redis` e rodar `pnpm dev` fora do container.
services:
  postgres:
    image: postgres:17.6-bookworm
    environment:
      POSTGRES_USER: lms
      POSTGRES_PASSWORD: lms
      POSTGRES_DB: lms_cursos
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lms -d lms_cursos"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7.4.5-bookworm
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    build: { context: ., dockerfile: Dockerfile.worker }
    command: ["pnpm", "--filter", "@lms/db", "migrate"]
    environment:
      DATABASE_URL: postgres://lms:lms@postgres:5432/lms_cursos
    depends_on:
      postgres: { condition: service_healthy }

  web:
    build: { context: ., dockerfile: Dockerfile.web }
    ports: ["3000:3000"]
    env_file: [.env]
    environment:
      DATABASE_URL: postgres://lms:lms@postgres:5432/lms_cursos
      REDIS_URL: redis://redis:6379
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

  worker:
    build: { context: ., dockerfile: Dockerfile.worker }
    env_file: [.env]
    environment:
      DATABASE_URL: postgres://lms:lms@postgres:5432/lms_cursos
      REDIS_URL: redis://redis:6379
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

volumes:
  pgdata:
